name: Deploy Allino Next.js to GitHub Pages

on:
  push:
    branches: [main, feature/nextjs-rental-platform, feature/real-vehicle-photos]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Fix GitHub Pages asset paths
        run: |
          find app -type f \( -name '*.tsx' -o -name '*.ts' -o -name '*.css' \) -print0 | xargs -0 sed -i 's#"/assets/#"assets/#g; s#\x27/assets/#\x27assets/#g'
      - name: Build
        run: npm run build
      - name: Copy public vehicle assets
        run: |
          mkdir -p ./out/assets
          cp -R ./assets/. ./out/assets/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
